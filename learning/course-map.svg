    <text x="508" y="159" text-anchor="start" font-size="24" font-weight="700" fill="#132F63">独立验证</text>
    <line x1="462" y1="175" x2="614" y2="175" stroke="#BCD4F8" stroke-width="1"/>
    <text x="464" y="204" text-anchor="start" font-size="18" font-weight="500" fill="#1E293B">固定初态运行</text>
    <text x="464" y="230" text-anchor="start" font-size="18" font-weight="500" fill="#1E293B">按本轮证据判定</text>
    <polygon points="533,240 543,240 538,246" fill="#6B98E8"/>
    <rect x="458" y="252" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#B3CDF5" stroke-width="1"/>
