    <text x="878" y="307" text-anchor="start" font-size="18" font-weight="600" fill="#1D4ED8">与对照评测表</text>
  </g>

  <!-- 箭头 5 -> 6 -->
  <line x1="1036" y1="229" x2="1052" y2="229" stroke="#2563EB" stroke-width="2"/>
  <polygon points="1060,229 1051,224 1051,234" fill="#2563EB"/>

  <!-- 阶段 06：回归交接（淡蓝） -->
  <g id="stage-06">
    <rect x="1060" y="128" width="180" height="206" rx="14" fill="#0F172A" fill-opacity="0.05"/>
    <rect x="1060" y="126" width="180" height="206" rx="14" fill="#EAF2FF" stroke="#7DA7EB" stroke-width="1.5"/>
    <rect x="1076" y="138" width="36" height="26" rx="13" fill="#2563EB"/>
