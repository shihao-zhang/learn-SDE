    <text x="100" y="159" text-anchor="start" font-size="24" font-weight="700" fill="#0B3B44">规格定义</text>
    <line x1="54" y1="175" x2="206" y2="175" stroke="#B5E0E2" stroke-width="1"/>
    <text x="56" y="204" text-anchor="start" font-size="18" font-weight="500" fill="#1E293B">用正反例写清</text>
    <text x="56" y="230" text-anchor="start" font-size="18" font-weight="500" fill="#1E293B">边界与验收规格</text>
    <polygon points="125,240 135,240 130,246" fill="#5CB3B7"/>
    <rect x="50" y="252" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#A8D8DA" stroke-width="1"/>
    <rect x="50" y="262" width="4" height="50" rx="2" fill="#0E7C86"/>
    <text x="62" y="281" text-anchor="start" font-size="18" font-weight="600" fill="#0B5F67">验收规格文档</text>
    <text x="62" y="307" text-anchor="start" font-size="18" font-weight="600" fill="#0B5F67">与正反用例集</text>
  </g>

  <!-- 箭头 1 -> 2 -->
  <line x1="220" y1="229" x2="236" y2="229" stroke="#2563EB" stroke-width="2"/>
  <polygon points="244,229 235,224 235,234" fill="#2563EB"/>

  <!-- 阶段 02：协作开发（淡青） -->
  <g id="stage-02">
    <rect x="244" y="128" width="180" height="206" rx="14" fill="#0F172A" fill-opacity="0.05"/>
    <rect x="244" y="126" width="180" height="206" rx="14" fill="#E8F7F6" stroke="#6DBEC1" stroke-width="1.5"/>
