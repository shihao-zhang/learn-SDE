    <rect x="448" y="128" width="180" height="206" rx="14" fill="#0F172A" fill-opacity="0.05"/>
    <rect x="448" y="126" width="180" height="206" rx="14" fill="#EAF2FF" stroke="#7DA7EB" stroke-width="1.5"/>
