    <text x="470" y="307" text-anchor="start" font-size="18" font-weight="600" fill="#1D4ED8">与验证结果单</text>
  </g>

  <!-- 箭头 3 -> 4 -->
  <line x1="628" y1="229" x2="644" y2="229" stroke="#2563EB" stroke-width="2"/>
  <polygon points="652,229 643,224 643,234" fill="#2563EB"/>

  <!-- 阶段 04：故障修复（淡蓝） -->
  <g id="stage-04">
    <rect x="652" y="128" width="180" height="206" rx="14" fill="#0F172A" fill-opacity="0.05"/>
