    <rect x="1070" y="262" width="4" height="50" rx="2" fill="#2563EB"/>
    <text x="1082" y="281" text-anchor="start" font-size="18" font-weight="600" fill="#1D4ED8">新版业务规则</text>
    <text x="1082" y="307" text-anchor="start" font-size="18" font-weight="600" fill="#1D4ED8">与复跑交接包</text>
  </g>
</g>
<rect x="48" y="350" width="1184" height="141" rx="12" fill="#F1F5FB"/>
<text x="70" y="389" font-size="22" font-weight="650" fill="#0047AB">软件工程基础 · 10 章</text>
<text x="319" y="388" font-size="18" font-weight="400" fill="#192534">工程与变更流程、规格、版本协作、测试与持续集成、环境部署、调试、发布、观测与安全</text>
<text x="70" y="438" font-size="21" font-weight="650" fill="#0047AB">四个核心专题</text>
<text x="319" y="438" font-size="18" font-weight="400" fill="#192534">企业软件商业与合规　 /　 系统设计与数据　 /　 网络与操作系统　 /　 模型推理服务工程</text>
<text x="319" y="469" font-size="17" font-weight="400" fill="#495C73">随阶段练习选读：启动服务时学环境，接入模型时学延迟与成本。</text>
<text x="48" y="552" font-size="26" font-weight="650" fill="#0047AB">项目如何递进</text>
<text x="254" y="551" font-size="21" font-weight="400" fill="#192534">先让软件支持员工工作，再检验数字员工，最后学习跨场景生产评测包。</text>
