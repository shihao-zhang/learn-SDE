    <text x="304" y="159" text-anchor="start" font-size="24" font-weight="700" fill="#0B3B44">协作开发</text>
    <line x1="258" y1="175" x2="410" y2="175" stroke="#B5E0E2" stroke-width="1"/>
    <text x="260" y="204" text-anchor="start" font-size="18" font-weight="500" fill="#1E293B">让Agent读仓库</text>
    <text x="260" y="230" text-anchor="start" font-size="18" font-weight="500" fill="#1E293B">提计划并验变更</text>
    <polygon points="329,240 339,240 334,246" fill="#5CB3B7"/>
    <rect x="254" y="252" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#A8D8DA" stroke-width="1"/>
    <rect x="254" y="262" width="4" height="50" rx="2" fill="#0E7C86"/>
    <text x="266" y="281" text-anchor="start" font-size="18" font-weight="600" fill="#0B5F67">审定改动计划</text>
    <text x="266" y="307" text-anchor="start" font-size="18" font-weight="600" fill="#0B5F67">与可运行变更</text>
  </g>

  <!-- 箭头 2 -> 3 -->
  <line x1="424" y1="229" x2="440" y2="229" stroke="#2563EB" stroke-width="2"/>
  <polygon points="448,229 439,224 439,234" fill="#2563EB"/>

  <!-- 阶段 03：独立验证（淡蓝） -->
