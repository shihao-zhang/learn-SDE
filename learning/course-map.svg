    <text x="674" y="281" text-anchor="start" font-size="18" font-weight="600" fill="#1D4ED8">故障修复补丁</text>
    <text x="674" y="307" text-anchor="start" font-size="18" font-weight="600" fill="#1D4ED8">与回归用例集</text>
  </g>

  <!-- 箭头 4 -> 5 -->
  <line x1="832" y1="229" x2="848" y2="229" stroke="#2563EB" stroke-width="2"/>
  <polygon points="856,229 847,224 847,234" fill="#2563EB"/>

  <!-- 阶段 05：受控接入（淡蓝） -->
  <g id="stage-05">
    <rect x="856" y="128" width="180" height="206" rx="14" fill="#0F172A" fill-opacity="0.05"/>
    <rect x="856" y="126" width="180" height="206" rx="14" fill="#EAF2FF" stroke="#7DA7EB" stroke-width="1.5"/>
    <rect x="872" y="138" width="36" height="26" rx="13" fill="#2563EB"/>
    <text x="890" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">05</text>
    <text x="916" y="159" text-anchor="start" font-size="24" font-weight="700" fill="#132F63">受控接入</text>
    <line x1="870" y1="175" x2="1022" y2="175" stroke="#BCD4F8" stroke-width="1"/>
    <text x="872" y="204" text-anchor="start" font-size="18" font-weight="500" fill="#1E293B">限定办单工具权限</text>
    <text x="872" y="230" text-anchor="start" font-size="18" font-weight="500" fill="#1E293B">并对照人或脚本</text>
    <polygon points="941,240 951,240 946,246" fill="#6B98E8"/>
