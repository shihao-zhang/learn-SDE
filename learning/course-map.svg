<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1020" viewBox="0 0 1280 1020" font-family="PingFang SC,Hiragino Sans GB,sans-serif"><title>AI 软件工程课程架构：六阶段方法与三个项目</title><rect width="1280" height="1020" fill="white"/>
<text x="48" y="55" font-size="38" font-weight="700" fill="#192534">AI 软件工程：从交付软件到生产评测</text>
<text x="49" y="104" font-size="26" font-weight="650" fill="#0047AB">六阶段方法</text>
<text x="235" y="103" font-size="21" font-weight="400" fill="#192534">PM 定义预期、审计划、验结果；coding agent 协助实现与修复。</text>
<g id="learning-map-six-stages" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <!-- 阶段 01：规格定义（淡青） -->
  <g id="stage-01">
    <rect x="40" y="128" width="180" height="206" rx="14" fill="#0F172A" fill-opacity="0.05"/>
    <rect x="40" y="126" width="180" height="206" rx="14" fill="#E8F7F6" stroke="#6DBEC1" stroke-width="1.5"/>
    <rect x="56" y="138" width="36" height="26" rx="13" fill="#0E7C86"/>
