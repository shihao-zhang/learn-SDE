    <text x="668" y="204" text-anchor="start" font-size="18" font-weight="500" fill="#1E293B">复现失败并修复</text>
    <text x="668" y="230" text-anchor="start" font-size="18" font-weight="500" fill="#1E293B">补齐回归用例</text>
    <polygon points="737,240 747,240 742,246" fill="#6B98E8"/>
    <rect x="662" y="252" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#B3CDF5" stroke-width="1"/>
